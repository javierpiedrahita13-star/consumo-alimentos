<!DOCTYPE html>
    <option>CAÑAVERAL</option>
    <option>ARRECIFE</option>
  </select>

  <label>Tipo de comida</label>
  <select id="tipo">
    <option>DESAYUNO</option>
    <option>ALMUERZO</option>
    <option>CENA</option>
  </select>

  <div id="productos"></div>

  <button onclick="agregarProducto()">+ Agregar producto</button>

  <button onclick="guardarTodo()">Guardar Todo</button>

  <p id="msg" class="ok"></p>
</div>

<script>
let contador = 0;

function agregarProducto() {
  contador++;

  let div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <label>Producto</label>
    <input type="text" class="producto" placeholder="Ej: Arroz">

    <label>Cantidad</label>
    <input type="number" class="cantidad">
  `;

  document.getElementById("productos").appendChild(div);
}

function guardarTodo() {
  let sede = document.getElementById("sede").value;
  let tipo = document.getElementById("tipo").value;

  let productos = document.querySelectorAll(".producto");
  let cantidades = document.querySelectorAll(".cantidad");

  if (productos.length === 0) {
    alert("Agrega al menos un producto");
    return;
  }

  let registros = JSON.parse(localStorage.getItem("consumos")) || [];

  for (let i = 0; i < productos.length; i++) {
    let prod = productos[i].value;
    let cant = cantidades[i].value;

    if (!prod || !cant) continue;

    registros.push({
      sede,
      tipo,
      producto: prod,
      cantidad: cant,
      fecha: new Date().toLocaleString()
    });
  }

  localStorage.setItem("consumos", JSON.stringify(registros));

  document.getElementById("msg").innerText = "Guardado ✔";

  document.getElementById("productos").innerHTML = "";
}

// Agregar uno por defecto
agregarProducto();
</script>

</body>
</html>
