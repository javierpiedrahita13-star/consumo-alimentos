<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumo Alimentos</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
.card { max-width:420px; margin:auto; background:white; padding:20px; border-radius:10px; }
h2 { text-align:center; }
select, input, button { width:100%; padding:10px; margin-top:10px; }
button { background:#28a745; color:white; border:none; border-radius:5px; }
.item { border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px; }
</style>
</head>

<body>

<div class="card">
<h2>Registro Consumo</h2>

<label>Sede</label>
<select id="sede">
<option>CAÑAVERAL</option>
<option>ARRECIFE</option>
</select>

<label>Tipo de comida</label>
<select id="tipo">
<option>DESAYUNO</option>
<option>ALMUERZO</option>
<option>CENA</option>
</select>

<div id="productos"></div>

<button onclick="agregarProducto()">+ Agregar producto</button>
<button onclick="guardarTodo()">Guardar Todo</button>
</div>

<script>

const data = {
"FRUVER": ["AHUYAMA","AJO","APIO","CEBOLLA BLANCA","CEBOLLA ROJA","CEBOLLA LARGA","CILANTRO","ESPINACA","HABICHUELA","LECHUGA","LIMON","MAZORCA","PAPA","PEPINO","PIMENTON ROJO","PIMENTON VERDE","PLATANO","PLATANO VERDE","REMOLACHA","REPOLLO BLANCO","REPOLLO MORADO","TAMARINDO","TOMATE","YUCA","ZANAHORIA","ZUKINI","OTRO"],
"LACTEOS Y EMBUTIDOS": ["CREMA DE LECHE","HUEVOS","JAMON","LECHE ENTERA","PAN TAJADO","QUESO COSTEÑO","QUESO MOZARELLA","SALCHICHA"],
"CARNES BLANCAS": ["GOULASH CERDO","PULPA CERDO"],
"CARNES ROJAS": ["CARNE ASAR","CARNE MOLIDA","MONDONGO","CARNE DESMECHADA","COSTILLA","GOULASH RES","HIGADO"],
"PESCADOS": ["BONITO","ROBALO","CHIVO"],
"ABARROTES": ["ACEITE","ARROZ","AZUCAR","CHOCOLATE","FIDEOS","FRIJOL","GARBANZO","HARINA MAIZ","HARINA TRIGO","LENTEJA","MAYONEZA","MOSTAZA","PANELA","PASTA TOMATE","ESPAGUETI","PIMIENTA","SAL","SALSA NEGRA","SALSA SOYA","SALSA TOMATE","VINAGRE","PULPA FRUTA"]
};

function agregarProducto(){

let div = document.createElement("div");
div.className="item";

// AREA
let area = document.createElement("select");
area.className="area";

for(let key in data){
let op = document.createElement("option");
op.value=key;
op.textContent=key;
area.appendChild(op);
}

// PRODUCTO
let producto = document.createElement("select");
producto.className="producto";

// CANTIDAD
let cantidad = document.createElement("input");
cantidad.type="number";
cantidad.className="cantidad";

// cargar productos iniciales
</html>
