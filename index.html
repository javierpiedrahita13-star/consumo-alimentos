<script>

const data = {
"FRUVER": ["AHUYAMA","AJO","APIO","CEBOLLA BLANCA","CEBOLLA ROJA","CEBOLLA LARGA","CILANTRO","ESPINACA","HABICHUELA","LECHUGA","LIMON","MAZORCA","PAPA","PEPINO","PIMENTON ROJO","PIMENTON VERDE","PLATANO","PLATANO VERDE","REMOLACHA","REPOLLO BLANCO","REPOLLO MORADO","TAMARINDO","TOMATE","YUCA","ZANAHORIA","ZUKINI","OTRO"],
"LACTEOS Y EMBUTIDOS": ["CREMA DE LECHE","HUEVOS","JAMON","LECHE ENTERA","PAN TAJADO","QUESO COSTEÑO","QUESO MOZARELLA","SALCHICHA"],
"CARNES BLANCAS": ["GOULASH CERDO","PULPA CERDO"],
"CARNES ROJAS": ["CARNE ASAR","CARNE MOLIDA","MONDONGO","CARNE DESMECHADA","COSTILLA","GOULASH RES","HIGADO"],
"PESCADOS": ["BONITO","ROBALO","CHIVO"],
"ABARROTES": ["ACEITE","ARROZ","AZUCAR","CHOCOLATE","FIDEOS","FRIJOL","GARBANZO","HARINA MAIZ","HARINA TRIGO","LENTEJA","MAYONEZA","MOSTAZA","PANELA","PASTA TOMATE","ESPAGUETI","PIMIENTA","SAL","SALSA NEGRA","SALSA SOYA","SALSA TOMATE","VINAGRE","PULPA FRUTA"]
};

// fecha
let hoy = new Date().toISOString().split('T')[0];
document.getElementById("fecha").value = hoy;

// TABLA
let lista = [];

function cargarProductos(area, select){
select.innerHTML="";
data[area].forEach(p=>{
let op=document.createElement("option");
op.value=p;
op.textContent=p;
select.appendChild(op);
});
}

// crear fila de ingreso
function agregarProducto(){

let contenedor = document.getElementById("productos");
contenedor.innerHTML = ""; // solo uno a la vez

let div = document.createElement("div");
div.className="item";

let area = document.createElement("select");
Object.keys(data).forEach(key=>{
let op=document.createElement("option");
op.value=key;
op.textContent=key;
area.appendChild(op);
});

let producto = document.createElement("select");
let cantidad = document.createElement("input");
cantidad.type="number";
cantidad.placeholder="Cantidad";

cargarProductos(area.value, producto);

area.onchange = ()=> cargarProductos(area.value, producto);

// botón agregar a tabla
let btn = document.createElement("button");
btn.textContent = "Agregar a lista";
btn.type="button";

btn.onclick = ()=>{
if(!cantidad.value){
alert("Ingresa cantidad");
return;
}

// guardar en array
lista.push({
area: area.value,
producto: producto.value,
cantidad: cantidad.value
});

// render tabla
renderTabla();

// limpiar
agregarProducto();
};

div.appendChild(area);
div.appendChild(producto);
div.appendChild(cantidad);
div.appendChild(btn);

contenedor.appendChild(div);
}

// mostrar tabla
function renderTabla(){

let cont = document.getElementById("tabla");
if(!cont){
cont = document.createElement("div");
cont.id="tabla";
document.querySelector(".card").appendChild(cont);
}

let html = `
<table border="1" style="width:100%; margin-top:10px; border-collapse:collapse;">
<tr>
<th>Área</th>
<th>Producto</th>
<th>Cantidad</th>
</tr>
`;

lista.forEach(item=>{
html += `
<tr>
<td>${item.area}</td>
<td>${item.producto}</td>
<td>${item.cantidad}</td>
</tr>
`;
});

html += "</table>";

cont.innerHTML = html;
}

// guardar todo
function guardarTodo(){

let sede=document.getElementById("sede").value;
let tipo=document.getElementById("tipo").value;
let fecha=document.getElementById("fecha").value;

let registros=JSON.parse(localStorage.getItem("consumos"))||[];

lista.forEach(item=>{
registros.push({
fecha,
sede,
tipo,
area:item.area,
producto:item.producto,
cantidad:item.cantidad
});
});

localStorage.setItem("consumos",JSON.stringify(registros));

alert("Guardado ✔");

// reset
lista = [];
document.getElementById("tabla").innerHTML="";
agregarProducto();
}

// iniciar
agregarProducto();

</script>
